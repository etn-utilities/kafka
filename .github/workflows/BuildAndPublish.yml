name: Publish to NuGet

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    # NuGet/setup-nuget@v1.2.0
    - name: Setup NuGet
      uses: NuGet/setup-nuget@296fd3ccf8528660c91106efefe2364482f86d6f
      
    - name: Add private NuGet source
      run: nuget sources Add -Username ${{ github.actor }} -Password ${{ secrets.GITHUB_TOKEN }} -StorePasswordInClearText -Name github -Source "https://nuget.pkg.github.com/etn-utilities/index.json"

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v2.6.0
      with:
        arguments: releaseTarGz

#    - name: Find Kafka zip
#      run: find . -name "kafka*.tgz"
        
    - name: Extract Kafka package
      run: |
        ARCHIVE_PATH=$(find . -name "kafka_*.tgz" | head -1)
        echo "Found archive: $ARCHIVE_PATH"
        mkdir -p ./extract/kafka
        tar -xzf $ARCHIVE_PATH -C ./extract/kafka --strip-components=1
        ls -la ./extract/kafka/
  
#    - name: Quick glance at extraction
#      run: ls -R ./extract
  
    - name: Generate and publish NuGet packages
      run: |
        # Get version from gradle.properties and convert SNAPSHOT to pre-release format for NuGet
        VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
        NUGET_VERSION=$(echo $VERSION | sed 's/-SNAPSHOT/-preview/')
        echo "Building NuGet package version: $NUGET_VERSION"
        
        # Ensure all expected directories exist (some may be optional)
        # Create empty placeholder if site-docs doesn't exist to prevent pack errors
        if [ ! -d "./extract/kafka/site-docs" ] || [ -z "$(ls -A ./extract/kafka/site-docs 2>/dev/null)" ]; then
          echo "Warning: site-docs directory is empty or missing, creating placeholder"
          mkdir -p ./extract/kafka/site-docs
          echo "Documentation not included in this build" > ./extract/kafka/site-docs/README.txt
        fi
        
        nuget pack ./nupkg/kafka.nuspec -Version $NUGET_VERSION -noninteractive -basepath .
        nuget push *.nupkg -Source github -ApiKey ${{ secrets.GITHUB_TOKEN }} -SkipDuplicate -NonInteractive
